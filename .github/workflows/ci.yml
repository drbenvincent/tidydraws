name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lock:
    name: Lock freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: false
      - run: uv lock --check

  test:
    defaults:
      run:
        shell: bash
    name: test (${{ matrix.os }}, py${{ matrix.python }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11", backend: legacy}
          - {os: ubuntu-latest, python: "3.12", backend: modern}
          - {os: ubuntu-latest, python: "3.13", backend: modern}
          - {os: ubuntu-latest, python: "3.14", backend: modern}
          - {os: macos-latest, python: "3.12", backend: modern}
          - {os: windows-latest, python: "3.12", backend: modern}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: uv sync --locked --no-default-groups --group test
      - run: uv pip check
      - run: uv run --no-sync python scripts/check_environment.py "$EXPECTED_BACKEND"
        env:
          EXPECTED_BACKEND: ${{ matrix.backend }}
      - run: uv run --no-sync pytest --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: error

  tests:
    name: Tests
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.test.result }}

  quality:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked
      - run: make precommit

  workflows:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked --no-default-groups --group lint
      - run: uv run --no-sync zizmor --offline .github/workflows

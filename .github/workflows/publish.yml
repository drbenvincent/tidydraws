name: PyPI release

# The tag push starts the entire automatic release. Manual tag runs are retries;
# branch/manual/PR runs validate artifacts but can never publish.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["[0-9]*"]

permissions: {}
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Artifact validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked --group docs
      - name: Validate the release commit before any publication
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --locked python scripts/release.py tag "$RELEASE_TAG"
          make precommit test
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          version: "1.9.38"
      - if: startsWith(github.ref, 'refs/tags/')
        run: make docs
      - run: make build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: .scratch/dist/*
          if-no-files-found: error
          include-hidden-files: true

  test-publish:
    name: TestPyPI and exact-version verification
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      startsWith(github.ref, 'refs/tags/') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
          repository-url: https://test.pypi.org/legacy/
      - run: uv run --no-project python scripts/verify_testpypi.py dist

  publish:
    name: PyPI
    needs: [build, test-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    if: >-
      startsWith(github.ref, 'refs/tags/') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  create-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the release once publication succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG"; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi

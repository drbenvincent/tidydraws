# Pre-commit hooks run via `prek` (a fast, pre-commit-compatible runner).
# CI and local checks run `make precommit` on all files.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude_types: [svg]
      - id: end-of-file-fixer
        exclude_types: [svg]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1500"]
  - repo: local
    hooks:
      - id: ruff
        name: Ruff (locked project environment)
        language: system
        entry: uv run --locked ruff check --fix
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: Ruff format (locked project environment)
        language: system
        entry: uv run --locked ruff format
        files: \.(py|pyi|ipynb|qmd)$
      - id: mypy
        name: mypy (whole package, real dependencies)
        language: system
        entry: uv run --locked mypy tidydraws
        pass_filenames: false
        always_run: true
      - id: workflows
        name: Workflow security (zizmor)
        language: system
        entry: uv run --locked zizmor --offline .github/workflows
        pass_filenames: false
        files: ^\.github/(workflows/|dependabot\.yml)
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        name: Add MIT license header to Python files
        args:
          - --license-filepath=LICENSE_HEADER.txt
          - --comment-style=#
          - --detect-license-in-X-top-lines=10
          - --use-current-year
        files: \.py$
        exclude: ^tests/__init__\.py$
